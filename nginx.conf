server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------
    # Compression (performance)
    # -----------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        text/javascript
        image/svg+xml;

    # -----------------------------
    # Security headers
    # -----------------------------
    # IMPORTANT: nginx does NOT inherit add_header directives from the server
    # block into nested location blocks. Any location that defines its own
    # add_header directive(s) silently drops ALL server-block add_header
    # entries. Security headers are therefore injected via an include file
    # that is repeated inside every location block.
    # See: nginx/security_headers.conf for header definitions and commentary.

    # -----------------------------
    # Health check endpoint
    # -----------------------------
    location = /health {
        include /etc/nginx/conf.d/security_headers.conf;
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "healthy\n";
    }

    # -----------------------------
    # PWA update reliability
    # -----------------------------
    # Ensure the service worker updates reliably
    location = /sw.js {
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "no-cache" always;
        expires -1;
    }

    # Ensure the manifest updates reliably
    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "no-cache" always;
        expires -1;
    }

    # -----------------------------
    # Caching (important for SPAs)
    # -----------------------------

    # Never cache index.html (so new deployments show up immediately)
    location = /index.html {
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Also avoid caching the homepage response
    location = / {
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri /index.html;
    }

    # Cache Vite hashed assets forever
    location /assets/ {
        include /etc/nginx/conf.d/security_headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Cache other static files (if any)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        include /etc/nginx/conf.d/security_headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # -----------------------------
    # SPA routing fallback
    # -----------------------------
    location / {
        include /etc/nginx/conf.d/security_headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------
    # Block hidden files
    # -----------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
