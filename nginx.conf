server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------
    # Compression (performance)
    # -----------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        text/javascript
        image/svg+xml;

    # -----------------------------
    # Security headers (starter-friendly + PWA-aware)
    # -----------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # CSP:
    # - Allows service worker and manifest
    # - Allows Google Fonts (if used)
    # - IMPORTANT: replace https://api.example.com with your actual API base URL
    #   (https://api.* is NOT a valid CSP wildcard — it matches the literal hostname)
    # - 'unsafe-inline' removed from style-src; Vite+SCSS extracts all CSS to
    #   static files so inline styles are not needed
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self';
        style-src 'self' https://fonts.googleapis.com;
        font-src 'self' data: https://fonts.gstatic.com;
        img-src 'self' data:;
        connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://api.example.com;
        worker-src 'self';
        manifest-src 'self';
        object-src 'none';
        frame-ancestors 'none';
        base-uri 'self';
    " always;

    # -----------------------------
    # Health check endpoint
    # -----------------------------
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # -----------------------------
    # PWA update reliability
    # -----------------------------
    # Ensure the service worker updates reliably
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        expires -1;
    }

    # Ensure the manifest updates reliably
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        expires -1;
    }

    # -----------------------------
    # Caching (important for SPAs)
    # -----------------------------

    # Never cache index.html (so new deployments show up immediately)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Also avoid caching the homepage response
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri /index.html;
    }

    # Cache Vite hashed assets forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Cache other static files (if any)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # -----------------------------
    # SPA routing fallback
    # -----------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------
    # Block hidden files
    # -----------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
