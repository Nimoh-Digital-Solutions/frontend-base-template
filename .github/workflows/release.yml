name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Create Release PR or Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full git history lets Changesets diff against the last release tag
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          registry-url: https://npm.pkg.github.com
          scope: "@nimoh-digital-solutions"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Authenticate with GitHub Packages
        # changesets/action sets NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc and checks
        # that specific file for auth. Writing to project .npmrc or ~/.npmrc is ignored.
        # Pre-creating $RUNNER_TEMP/.npmrc with the scoped auth token means changesets
        # finds it already exists and won't overwrite our entry.
        # Yarn install has already run so it won't choke on this file.
        run: |
          echo "//npm.pkg.github.com/:_authToken=$NPM_TOKEN" >> "$RUNNER_TEMP/.npmrc"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build packages
        run: yarn packages:build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # When un-released changesets exist: opens (or updates) a "Version Packages" PR
          # When the Version Packages PR is merged: runs this command to publish
          publish: yarn changeset:publish
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          # GITHUB_TOKEN is used by changesets/action to open/update the Version Packages PR.
          # NPM_TOKEN is a fine-grained PAT — changesets/action reads this specifically to
          # authenticate npm registry checks (npm info) and to publish packages.
          # NODE_AUTH_TOKEN is read by the .npmrc written by actions/setup-node for yarn publish.
          # Both NPM_TOKEN and NODE_AUTH_TOKEN must point to the same PAT.
          # The PAT needs account-level Packages: Read & write (not just repo-level).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
