services:
  # Development environment with hot-reload
  app:
    image: node:22-alpine
    container_name: react-starter-kit-dev
    # Dev containers run as root so yarn can write to the node_modules volume.
    # The production image (app-prod) enforces non-root via nginx-unprivileged.
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - yarn_cache:/root/.yarn/berry/cache
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - DOCKER=true

      # Helps file watching reliability in some Docker setups (esp. Mac/Win)
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

      # Optional: enable PWA during dev in Docker
      # - VITE_PWA=true

    command: >-
      sh -c "corepack enable
      && corepack prepare yarn@4.12.0 --activate
      && yarn install
      && yarn dev"
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true

  # Production preview (multi-stage build -> nginx)
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react-starter-kit-prod
    ports:
      - '8080:8080'
    restart: unless-stopped
    environment:
      # CSP connect-src domain — override with your actual API URL
      - CSP_CONNECT_SRC=https://api.example.com

    # Optional hardening (safe defaults for static nginx)
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # Backend API service (example)
  # -------------------------------------------------------------------------
  # Uncomment when wiring to a backend API. This example assumes a Django/DRF
  # app with a standard Dockerfile. Adjust the image/build context to match.
  #
  # backend:
  #   build:
  #     context: ../your-backend
  #     dockerfile: Dockerfile
  #   container_name: react-starter-kit-api
  #   ports:
  #     - '8000:8000'
  #   environment:
  #     - DJANGO_SETTINGS_MODULE=config.settings.docker
  #     - DATABASE_URL=postgres://user:pass@db:5432/appdb
  #   depends_on:
  #     - db
  #   restart: unless-stopped
  #
  # db:
  #   image: postgres:16-alpine
  #   container_name: react-starter-kit-db
  #   environment:
  #     POSTGRES_USER: user
  #     POSTGRES_PASSWORD: pass
  #     POSTGRES_DB: appdb
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  yarn_cache:
  # pg_data:  # Uncomment when using the backend + db services
