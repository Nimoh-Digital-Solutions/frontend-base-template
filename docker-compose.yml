services:
  # Development environment with hot-reload
  app:
    image: node:22-alpine
    container_name: react-starter-kit-dev
    # Dev containers run as root so yarn can write to the node_modules volume.
    # The production image (app-prod) enforces non-root via nginx-unprivileged.
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - yarn_cache:/usr/local/share/.cache/yarn
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - DOCKER=true

      # Helps file watching reliability in some Docker setups (esp. Mac/Win)
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

      # Optional: enable PWA during dev in Docker
      # - VITE_PWA=true

      # GitHub Packages auth — set NPM_TOKEN in your shell or a .env file:
      #   export NPM_TOKEN=ghp_yourtoken   OR   echo 'NPM_TOKEN=ghp_...' > .env
      - NPM_TOKEN=${NPM_TOKEN}

    command: >-
      sh -c "echo '//npm.pkg.github.com/:_authToken='\$NPM_TOKEN >> ~/.npmrc
      && yarn install
      && yarn dev"
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true

  # Production preview (multi-stage build -> nginx)
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      # Pass GitHub Packages token as a BuildKit secret so it never lands in
      # any image layer. Requires DOCKER_BUILDKIT=1 (default in Docker 23+).
      secrets:
        - npm_token
    container_name: react-starter-kit-prod
    ports:
      - '8080:8080'
    restart: unless-stopped

    # Optional hardening (safe defaults for static nginx)
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

volumes:
  yarn_cache:

# Read NPM_TOKEN from the host environment (or .env file at project root)
secrets:
  npm_token:
    environment: NPM_TOKEN
